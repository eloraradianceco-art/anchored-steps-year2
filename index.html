<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon2.png" />
    <link rel="apple-touch-icon" href="/icon2.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon2.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0D1820"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-title" content="Anchored Steps 2"/>
    <title>Anchored Steps: Year 2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
    <script src="/data_y2.js"></script>
    <style>
      *{margin:0;padding:0;box-sizing:border-box}
      html{background:#0D1820}
      body{background:#0D1820;font-family:'EB Garamond',Georgia,serif;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
      .fi{animation:fadeIn .35s ease}
      .fu{animation:fadeUp .3s ease}
      @keyframes fadeIn{from{opacity:0}to{opacity:1}}
      @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
      textarea{font-family:'EB Garamond',Georgia,serif}
      ::-webkit-scrollbar{width:4px}
      ::-webkit-scrollbar-track{background:transparent}
      ::-webkit-scrollbar-thumb{background:rgba(160,120,64,0.3);border-radius:2px}
    </style>
      <!-- iPad Home Screen app: iPadOS 26 blurs a band below the status bar (solid with Reduce
         Transparency). Headers keep their text below it; see --safe-top / --top-band. -->
    <style>:root{--top-band:0px;--safe-top:env(safe-area-inset-top,0px)}.ipad-app{--top-band:32px;--safe-top:calc(env(safe-area-inset-top,0px) + 32px)}</style>
    <script>(function(){try{var d=document.documentElement,n=navigator,ipad=/iPad/.test(n.userAgent)||(n.platform==='MacIntel'&&n.maxTouchPoints>1),app=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||n.standalone===true;if(ipad&&app)d.classList.add('ipad-app')}catch(e){}})()</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
